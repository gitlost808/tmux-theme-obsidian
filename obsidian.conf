# Obsidian Ember | tmux theme
# Matches Obsidian Ember Contrast Readable for WeeChat.
# tmux 3.2+ recommended; no external plugins or special fonts.
# Source with: tmux source-file ~/.config/tmux/themes/obsidian.conf
#
# Palette, matched to WeeChat's 256-color palette:
#   232 near black       235 deep graphite       238 grey panel
#   239 graphite grey    52 burgundy             167 ember red
#   203 coral red        250 soft silver         252 bright silver
#
# Status bar: deep graphite so it remains distinct from WeeChat's
# brighter status bar (colour239). Text has deliberately high contrast.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'fg=colour252,bg=colour235'
set -g status-left-length 30
set -g status-right-length 60
set -g status-left-style 'fg=colour252,bg=colour235'
set -g status-right-style 'fg=colour252,bg=colour235'

# Left: distinct burgundy session label, subtle ember divider.
set -g status-left '#[fg=colour252,bg=colour52,bold] #S #[fg=colour167,bg=colour235]│ '

# Right: active command, separator, 24-hour clock and date.
set -g status-right '#[fg=colour250]#{pane_current_command} #[fg=colour167]│ #[fg=colour252,bold]%H:%M #[fg=colour250]%d.%m '

# Window tabs: soft grey inactive, burgundy active, coral on alerts.
set -g window-status-separator ' '
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #I:#W#F '
set -g window-status-style 'fg=colour250,bg=colour235'
set -g window-status-current-style 'fg=colour252,bg=colour52,bold'
set -g window-status-activity-style 'fg=colour203,bg=colour235,bold'
set -g window-status-bell-style 'fg=colour252,bg=colour124,bold'
set -g window-status-last-style 'fg=colour244,bg=colour235'

# Pane split borders: quiet grey; the focused pane is ember red.
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour167'

# Commands, messages, copy-mode selection, and pane number overlay.
set -g message-style 'fg=colour252,bg=colour238'
set -g message-command-style 'fg=colour252,bg=colour52'
set -g mode-style 'fg=colour252,bg=colour52'
set -g display-panes-colour colour244
set -g display-panes-active-colour colour203
set -g clock-mode-colour colour167

# Intentionally no mouse settings, key bindings, terminal overrides,
# automatic renaming, or shell configuration changes.
